workflows:
  android-build:
    name: Cafe Tycoon Android Build
    max_build_duration: 30
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Patch AndroidManifest for AdMob test ID
        script: |
          python3 - << 'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          if "APPLICATION_ID" not in content:
              meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
              content = re.sub(r'(<application[^>]*>)', r'\1\n    ' + meta, content, count=1)
              with open(path, "w") as f:
                  f.write(content)
              print("Inserted AdMob APPLICATION_ID meta-data")
          else:
              print("APPLICATION_ID already present, skipping")
          PY
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
