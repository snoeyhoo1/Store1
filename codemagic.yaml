workflows:
  android-build:
    name: Cafe Tycoon Android Build
    max_build_duration: 30
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Patch AndroidManifest for AdMob test ID
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "APPLICATION_ID" "$MANIFEST"; then
            sed -i '0,/<activity/{s|<activity|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    <activity|}' "$MANIFEST"
          fi
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
